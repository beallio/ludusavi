# Builds the Linux release that the SDH-Ludusavi Steam Deck plugin ships.
# It uses the same recipe as the upstream "Main" workflow, so the files have the
# same shape as upstream releases and the plugin can switch back by changing one URL.
name: SDH Release

on:
  push:
    tags:
      - "v*-beallio.*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          targets: x86_64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc libxcb-composite0-dev libgtk-3-dev
      - run: cargo build --locked --release --target x86_64-unknown-linux-gnu
      - name: Collect third-party licenses
        run: |
          cargo install --locked cargo-lichking
          # Upstream's tasks.py also tolerates a non-zero exit as long as the bundle is written.
          cargo lichking bundle --file third-party.txt || true
          test -s third-party.txt
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          tar --create --gzip --file="dist/ludusavi-${TAG}-linux.tar.gz" \
            -C target/x86_64-unknown-linux-gnu/release ludusavi
          cp LICENSE "dist/ludusavi-${TAG}-LICENSE.txt"
          cp third-party.txt "dist/ludusavi-${TAG}-third-party.txt"
          cd dist && sha256sum -- * > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --prerelease --title "Ludusavi $TAG (SDH-Ludusavi build)" --notes \
            "Linux build of Ludusavi for the SDH-Ludusavi Steam Deck plugin, made from commit ${GITHUB_SHA}.

          It is upstream Ludusavi plus one change: Ludusavi saves a ready-to-use copy of its game list
          (manifest-cache.json) so each command starts faster. The copy is rebuilt whenever the game list changes.

          This is not an official Ludusavi release. See https://github.com/mtkennerly/ludusavi for official releases."
